# CI + 배포 (docs/배포가이드.md)
#   PR            : test
#   main push     : test → build-push(GHCR) → deploy(ssh)
#   수동 실행      : image_tag 를 주면 테스트/빌드를 건너뛰고 그 태그를 배포 (롤백용). 비우면 main push 와 동일
name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "배포할 이미지 태그 (예: sha-1a2b3c4). 비우면 현재 커밋을 테스트·빌드 후 배포"
        required: false
        default: ""

# 배포는 순서대로 하나씩 (진행 중인 배포를 취소하지 않음)
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: 테스트 (단위 + 통합)
    if: github.event_name != 'workflow_dispatch' || inputs.image_tag == ''
    runs-on: ubuntu-latest
    services:
      # IntegrationTestBase 가 localhost:55432 의 fileupload DB로 접속해 fileupload_test DB를 만들고 schema.sql 을 적용한다
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fileupload
          POSTGRES_USER: fileupload
          POSTGRES_PASSWORD: fileupload
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U fileupload -d fileupload"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 테스트 실행
        run: ./gradlew test --no-daemon

      - name: 테스트 리포트 업로드 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  build-push:
    name: 이미지 빌드 → GHCR (linux/arm64)
    needs: test
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.image_tag == '')
    # 배포 대상 VM 이 OCI Ampere A1(aarch64) 이라 ARM 러너에서 네이티브로 arm64 이미지를 만든다 (QEMU 에뮬레이션보다 수 배 빠름)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # sha-<7자리> 를 배포 기준 태그로 쓰고(롤백 시 지정), latest 는 편의용
          tags: |
            type=sha,format=short,priority=1000
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=file-upload-block
            org.opencontainers.image.description=${{ github.event.repository.description }}

      - name: 빌드 & 푸시
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 배포 (ssh)
    needs: [test, build-push]
    # push 는 build-push 성공 후, 수동(image_tag 지정)은 상위 잡이 skipped 인 상태로 바로 배포
    if: >-
      !cancelled() && (
        needs.build-push.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.image_tag != '' && needs.build-push.result == 'skipped')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://file-upload-block.danbee.site
    env:
      APP_IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.image_tag || needs.build-push.outputs.image_tag }}
      APP_DIR: ${{ vars.APP_DIR || '~/file-upload-block' }}
      SSH_PORT: ${{ vars.SSH_PORT || '22' }}
    steps:
      - uses: actions/checkout@v4

      - name: SSH 키 설정
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<CFG
          Host vm
            HostName ${{ secrets.SSH_HOST }}
            Port $SSH_PORT
            User ${{ secrets.SSH_USER }}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            ServerAliveInterval 30
          CFG

      - name: 서버 .env 생성 (GitHub Secrets/Variables → 서버)
        run: |
          # 변수 미설정 시 기본값. 비밀값은 Secrets, 그 외는 Variables 에서 읽는다
          # 따옴표 붙인 heredoc: ${{ }} 는 GitHub 이 먼저 치환하고, 치환된 값 안의 $ 등은 셸이 해석하지 않는다
          cat > app.env <<'ENV'
          APP_PORT=${{ vars.APP_PORT || '8090' }}
          DB_PORT=${{ vars.DB_PORT || '5432' }}
          DB_NAME=${{ vars.DB_NAME || 'fileupload' }}
          DB_USER=${{ vars.DB_USER || 'fileupload' }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          STORAGE_MODE=${{ vars.STORAGE_MODE || 's3' }}
          S3_BUCKET=${{ vars.S3_BUCKET || 'work-841820566166-us-east-1-an' }}
          S3_REGION=${{ vars.S3_REGION || 'us-east-1' }}
          S3_PREFIX=${{ vars.S3_PREFIX || 'uploads/' }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ENV
          grep -qE '^DB_PASSWORD=.+' app.env || { echo "::error::secrets.DB_PASSWORD 가 비어 있습니다"; exit 1; }

      - name: 배포 파일 복사
        run: |
          ssh vm "mkdir -p $APP_DIR"
          scp -q deploy/docker-compose.yml deploy/deploy.sh schema.sql "vm:$APP_DIR/"
          scp -q app.env "vm:$APP_DIR/.env"
          ssh vm "chmod 600 $APP_DIR/.env && chmod +x $APP_DIR/deploy.sh"

      - name: 배포 실행
        run: |
          ssh vm "APP_DIR='$APP_DIR' APP_IMAGE='$APP_IMAGE' \
                  GHCR_USER='${{ github.actor }}' GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
                  bash $APP_DIR/deploy.sh"

      - name: 외부 확인 (도메인)
        continue-on-error: true
        run: |
          # nginx/DNS/인증서가 아직 준비되지 않았을 수 있으므로 실패해도 배포 결과는 성공으로 둔다
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://file-upload-block.danbee.site/api/admin/policies || true)
          echo "https://file-upload-block.danbee.site/api/admin/policies → HTTP $code"
          [ "$code" = "200" ] || echo "::warning::도메인 응답이 200이 아닙니다 (nginx 설정·DNS·인증서 확인: docs/배포가이드.md 2-4)"
