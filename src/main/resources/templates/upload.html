<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/shell :: head('파일 업로드')}"></head>
<body>
<header th:replace="~{fragments/shell :: nav('upload')}"></header>

<main class="page">
    <div>
        <h1 class="page-title">파일 올리기</h1>
        <p class="page-sub">확장자 차단 정책과 내용 검사를 통과한 파일만 저장됩니다. 한 번에 여러 개를 올릴 수 있고, 파일마다 따로 판정합니다.</p>
    </div>

    <!-- ---------- 업로드 ---------- -->
    <section class="card" aria-labelledby="upload-title">
        <div class="card-head">
            <h2 id="upload-title">업로드</h2>
            <span class="count" id="picked-count" aria-live="polite"></span>
        </div>

        <label class="dropzone" id="dropzone" for="file-input" tabindex="0">
            <span class="dropzone-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>
                </svg>
            </span>
            <strong>파일을 끌어다 놓거나 클릭해서 선택</strong>
            <span>이미지·PDF는 바로 열 수 있고, 그 밖의 형식은 다운로드로만 제공됩니다</span>
        </label>
        <input type="file" id="file-input" multiple hidden aria-label="업로드할 파일 선택">

        <ul id="picked" class="picked" aria-label="선택한 파일"></ul>

        <div class="actions">
            <button type="button" class="btn primary" id="btn-upload" disabled>
                <span class="spinner" id="upload-spinner" hidden aria-hidden="true"></span>
                <span id="btn-upload-label">업로드</span>
            </button>
            <button type="button" class="btn ghost" id="btn-clear" hidden>비우기</button>
            <span class="spacer"></span>
        </div>

        <div class="progress" id="progress" hidden role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="업로드 진행률">
            <div class="progress-track"><div class="progress-bar" id="progress-bar"></div></div>
            <div class="progress-label"><span id="progress-text">전송 중</span><span class="num" id="progress-pct">0%</span></div>
        </div>

        <p id="upload-msg" class="msg" aria-live="polite"></p>
        <ul id="upload-results" class="results" aria-live="polite" aria-label="이번 업로드 결과"></ul>
    </section>

    <!-- ---------- 목록 ---------- -->
    <section class="card" aria-labelledby="list-title">
        <div class="card-head">
            <div>
                <h2 id="list-title">업로드된 파일 <span class="count" id="list-count"></span></h2>
                <p class="hint">저장된 파일만 최신순으로 보여줍니다. 거부된 파일은 남지 않습니다.</p>
            </div>
            <button type="button" class="btn ghost small" id="btn-refresh">새로고침</button>
        </div>

        <div id="list-loading" class="skeleton" aria-hidden="true"><div></div><div style="width:82%"></div><div style="width:64%"></div></div>
        <div id="list-error" class="retry" hidden>
            <span>목록을 불러오지 못했습니다.</span>
            <button type="button" class="btn ghost small" id="btn-list-retry">다시 시도</button>
        </div>
        <div id="list-empty" class="empty" hidden>
            <strong>아직 올린 파일이 없습니다</strong>
            위에서 파일을 올리면 여기에 나타납니다.
        </div>
        <div class="table-wrap" id="list-wrap" hidden>
            <table class="files">
                <thead>
                <tr>
                    <th>파일</th>
                    <th>형식</th>
                    <th class="right">크기</th>
                    <th>올린 시각</th>
                    <th class="right"><span class="sr-only">동작</span></th>
                </tr>
                </thead>
                <tbody id="list-body"></tbody>
            </table>
        </div>
    </section>
</main>

<script>
(function () {
    'use strict';
    var el = App.el, text = App.text, create = App.create;

    /* ---------- 파일 선택 ---------- */
    var picked = [];                      // input.files 는 읽기 전용이라 배열로 관리한다
    var uploading = false;

    function addFiles(fileList) {
        for (var i = 0; i < fileList.length; i++) { picked.push(fileList[i]); }
        renderPicked();
    }

    function extensionOf(name) {
        var dot = name.lastIndexOf('.');
        return dot > 0 && dot < name.length - 1 ? name.slice(dot + 1).toLowerCase() : '';
    }

    function renderPicked() {
        var list = el('picked');
        list.innerHTML = '';
        picked.forEach(function (file, index) {
            var li = create('li');
            var badge = create('span', 'ext-badge', extensionOf(file.name) || '없음');
            var name = create('span', 'name');
            text(name, file.name);
            name.title = file.name;
            var size = create('span', 'size num', App.formatBytes(file.size));
            var remove = create('button', 'icon-btn');
            remove.type = 'button';
            remove.setAttribute('aria-label', file.name + ' 선택 해제');
            remove.appendChild(App.icon('x'));
            remove.addEventListener('click', function () { picked.splice(index, 1); renderPicked(); });
            li.appendChild(badge); li.appendChild(name); li.appendChild(size); li.appendChild(remove);
            list.appendChild(li);
        });
        var total = picked.reduce(function (sum, f) { return sum + f.size; }, 0);
        text(el('picked-count'), picked.length ? picked.length + '개 · ' + App.formatBytes(total) : '');
        text(el('btn-upload-label'), picked.length ? picked.length + '개 업로드' : '업로드');
        el('btn-upload').disabled = uploading || picked.length === 0;
        el('btn-clear').hidden = uploading || picked.length === 0;
    }

    function clearPicked() {
        picked = [];
        el('file-input').value = '';      // 같은 파일을 다시 고를 수 있게 input 초기화
        renderPicked();
    }

    el('file-input').addEventListener('change', function (e) { addFiles(e.target.files); e.target.value = ''; });
    el('btn-clear').addEventListener('click', function () { clearPicked(); App.setMsg(el('upload-msg'), ''); });

    var dropzone = el('dropzone');
    dropzone.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el('file-input').click(); }
    });
    ['dragenter', 'dragover'].forEach(function (type) {
        dropzone.addEventListener(type, function (e) { e.preventDefault(); if (!uploading) { dropzone.classList.add('dragover'); } });
    });
    ['dragleave', 'drop'].forEach(function (type) {
        dropzone.addEventListener(type, function (e) { e.preventDefault(); dropzone.classList.remove('dragover'); });
    });
    dropzone.addEventListener('drop', function (e) {
        if (uploading) { return; }
        if (e.dataTransfer && e.dataTransfer.files) { addFiles(e.dataTransfer.files); }
    });

    /* ---------- 업로드 ---------- */
    function setBusy(busy) {
        uploading = busy;
        el('upload-spinner').hidden = !busy;
        el('btn-upload').disabled = busy || picked.length === 0;
        el('btn-clear').hidden = busy || picked.length === 0;
        dropzone.classList.toggle('busy', busy);
        text(el('btn-upload-label'), busy ? '업로드 중' : (picked.length ? picked.length + '개 업로드' : '업로드'));
    }

    function showProgress(percent, inspecting) {
        var box = el('progress');
        box.hidden = false;
        box.classList.toggle('inspecting', inspecting);
        box.setAttribute('aria-valuenow', String(percent));
        el('progress-bar').style.width = percent + '%';
        text(el('progress-pct'), inspecting ? '' : percent + '%');
        text(el('progress-text'), inspecting ? '서버에서 검사 중…' : '전송 중');
    }

    function renderResults(response) {
        var list = el('upload-results');
        list.innerHTML = '';
        var stored = 0;
        response.results.forEach(function (r, i) {
            var ok = r.status === 'STORED';
            if (ok) { stored++; }
            var li = create('li');
            li.style.animationDelay = (i * 40) + 'ms';
            var mark = create('span', 'mark ' + (ok ? 'ok' : 'bad'));
            mark.appendChild(App.icon(ok ? 'check' : 'x'));
            var body = create('div', 'body');
            var title = create('div', 'title');
            text(title, r.fileName || '(이름 없음)');
            body.appendChild(title);
            if (!ok) {
                body.appendChild(text(create('div', 'detail'), r.message));
            }
            (r.notices || []).forEach(function (notice) {
                body.appendChild(text(create('div', 'notice'), notice));
            });
            var side = create('div', 'side');
            side.appendChild(App.pill(ok ? 'ok' : 'bad', ok ? '저장됨' : '거부됨'));
            if (ok && r.publicId) {
                var link = create('a', 'btn ghost small');
                link.href = '/api/uploads/' + encodeURIComponent(r.publicId);
                var inline = r.disposition === 'INLINE';
                if (inline) { link.target = '_blank'; link.rel = 'noopener'; }
                link.appendChild(App.icon(inline ? 'eye' : 'download'));
                link.appendChild(document.createTextNode(inline ? '열기' : '다운로드'));
                side.appendChild(link);
            }
            li.appendChild(mark); li.appendChild(body); li.appendChild(side);
            list.appendChild(li);
        });
        var rejected = response.results.length - stored;
        var summary = stored + '개 저장' + (rejected ? ' · ' + rejected + '개 거부' : '');
        App.setMsg(el('upload-msg'), summary, rejected ? '' : 'ok');
        App.toast(summary, rejected && !stored ? 'error' : '');
    }

    function upload() {
        if (!picked.length || uploading) { return; }
        var form = new FormData();
        picked.forEach(function (file) { form.append('files', file); });

        setBusy(true);
        showProgress(0, false);
        App.setMsg(el('upload-msg'), '');
        el('upload-results').innerHTML = '';

        var xhr = new XMLHttpRequest();   // 진행률 표시를 위해 XHR 사용 (명세 10-2)
        xhr.open('POST', '/api/uploads');
        xhr.upload.addEventListener('progress', function (e) {
            if (!e.lengthComputable) { return; }
            var pct = Math.round(e.loaded / e.total * 100);
            showProgress(pct, pct >= 100);
        });
        xhr.upload.addEventListener('load', function () { showProgress(100, true); });
        function finish() { setBusy(false); el('progress').hidden = true; }
        xhr.addEventListener('load', function () {
            finish();
            var body = null;
            try { body = JSON.parse(xhr.responseText); } catch (e) { /* 본문 없음 */ }
            if (xhr.status >= 200 && xhr.status < 300 && body) {
                clearPicked();            // 성공 응답 뒤 선택 목록과 input 초기화
                renderResults(body);
                loadList();
            } else {
                App.setMsg(el('upload-msg'), body && body.message ? body.message : '업로드에 실패했습니다. (HTTP ' + xhr.status + ')', 'error');
            }
        });
        xhr.addEventListener('error', function () {
            finish();
            App.setMsg(el('upload-msg'), '네트워크 오류가 발생했습니다. 다시 시도해 주세요.', 'error');
        });
        xhr.send(form);
    }
    el('btn-upload').addEventListener('click', upload);

    /* ---------- 목록 ---------- */
    function show(id, visible) { el(id).hidden = !visible; }

    function typeLabel(item) {
        if (item.disposition === 'INLINE') { return App.pill('ok', '바로 보기'); }
        return App.pill('neutral', '다운로드 전용');
    }

    function renderList(items) {
        var body = el('list-body');
        body.innerHTML = '';
        items.forEach(function (item) {
            var tr = create('tr');

            var fileTd = create('td');
            var cell = create('div', 'file-cell');
            cell.appendChild(create('span', 'ext-badge', item.extension || '없음'));
            var name = create('span', 'file-name');
            text(name, item.fileName);
            name.title = item.fileName;
            cell.appendChild(name);
            fileTd.appendChild(cell);

            var typeTd = create('td');
            typeTd.appendChild(typeLabel(item));

            var sizeTd = create('td', 'right num muted', App.formatBytes(item.sizeBytes));
            var timeTd = create('td', 'muted', App.formatTime(item.createdAt));
            timeTd.title = new Date(item.createdAt).toLocaleString('ko-KR');

            var actionTd = create('td', 'right');
            var actions = create('div', 'row-actions');
            var href = '/api/uploads/' + encodeURIComponent(item.publicId);
            if (item.disposition === 'INLINE') {
                var open = create('a', 'btn ghost small');
                open.href = href; open.target = '_blank'; open.rel = 'noopener';
                open.appendChild(App.icon('eye'));
                open.appendChild(document.createTextNode('열기'));
                actions.appendChild(open);
            }
            var download = create('a', 'btn ghost small');
            download.href = href;
            download.setAttribute('download', item.fileName);
            download.appendChild(App.icon('download'));
            download.appendChild(document.createTextNode('다운로드'));
            actions.appendChild(download);
            actionTd.appendChild(actions);

            tr.appendChild(fileTd); tr.appendChild(typeTd); tr.appendChild(sizeTd); tr.appendChild(timeTd); tr.appendChild(actionTd);
            body.appendChild(tr);
        });
        text(el('list-count'), items.length ? items.length + '개' : '');
        show('list-empty', items.length === 0);
        show('list-wrap', items.length > 0);
    }

    async function loadList() {
        show('list-error', false);
        var firstLoad = el('list-body').children.length === 0;
        if (firstLoad) { show('list-loading', true); show('list-wrap', false); show('list-empty', false); }
        el('btn-refresh').disabled = true;
        try {
            var items = await App.api('/api/uploads?limit=100');
            renderList(items);
        } catch (e) {
            if (firstLoad) { show('list-wrap', false); show('list-empty', false); }
            show('list-error', true);
        } finally {
            show('list-loading', false);
            el('btn-refresh').disabled = false;
        }
    }
    el('btn-refresh').addEventListener('click', loadList);
    el('btn-list-retry').addEventListener('click', loadList);

    renderPicked();
    loadList();
})();
</script>
</body>
</html>
