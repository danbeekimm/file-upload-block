# file-upload-block.danbee.site 서버 블록 — 기존 nginx(antscamp.conf 와 같은 방식)에 추가한다 (docs/배포가이드.md 2-4)
#
# 전제 (ants-camp 와 동일한 토폴로지)
#   - Cloudflare 가 공개 TLS/프록시 담당 → 오리진은 Cloudflare Origin 인증서로 443 종단
#       VM 에 이미 있는 *.danbee.site Origin 인증서(portfolio.danbee.site 가 쓰는 것)를 재사용: /etc/nginx/ssl/portfolio-origin.pem , .key
#       (antscamp.site 용 cloudflare-origin.pem 은 다른 도메인이라 불가). Cloudflare SSL/TLS 모드: Full (strict)
#   - 앱은 127.0.0.1:8090 (GitHub 변수 APP_PORT 와 동일하게)
#   - 실제 클라이언트 IP: snippets/cloudflare-real-ip.conf 가 $remote_addr 를 CF-Connecting-IP 로 바꿔 준다
#
# 설치
#   sudo cp deploy/nginx/cloudflare-real-ip.conf /etc/nginx/snippets/
#   sudo cp deploy/nginx/file-upload-block.danbee.site.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/file-upload-block.danbee.site.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name file-upload-block.danbee.site;

    ssl_certificate     /etc/nginx/ssl/portfolio-origin.pem;
    ssl_certificate_key /etc/nginx/ssl/portfolio-origin.key;

    # Cloudflare 대역 → CF-Connecting-IP 를 $remote_addr 로 (server 블록 범위에만 적용)
    include snippets/cloudflare-real-ip.conf;

    # 앱의 요청 상한(spring.servlet.multipart.max-request-size=100MB)과 동일하게.
    # nginx 기본값 1m 이면 앱이 판정하기 전에 nginx 가 413 으로 끊어 파일별 부분 성공 응답을 줄 수 없다.
    # Cloudflare Free 플랜의 요청 본문 상한도 100MB 라 그 이상은 Cloudflare 가 먼저 413 을 낸다.
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $proxy_add_x_forwarded_for 대신 $remote_addr: 클라이언트가 보낸 X-Forwarded-For 는 버리고
        # nginx 가 확정한 주소(real_ip 적용 후)만 넘긴다. 앱의 IP 제한/차단이 위조 헤더로 우회되지 않게 하기 위함
        # (앱은 forward-headers-strategy=native 로 127.0.0.1 에서 온 이 헤더만 신뢰)
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # 100MB 업로드 + 서버 측 검사(이미지 리렌더링, 압축 파일 검사) 시간 여유.
        # Cloudflare 는 오리진 응답을 100초까지만 기다리므로 그보다 긴 처리는 어차피 524 가 난다
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}

# HTTP → HTTPS (Cloudflare 가 "Always Use HTTPS" 면 거의 오지 않지만 안전망)
server {
    listen 80;
    listen [::]:80;
    server_name file-upload-block.danbee.site;
    return 301 https://$host$request_uri;
}
