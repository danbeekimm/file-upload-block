# 운영/시연 배포용 (EC2 등에서 단일 호스트 실행)
#   docker compose -f docker-compose.prod.yml up -d --build
# 환경 변수는 .env 파일로 관리 (.env.example 참고). DB는 외부에 노출하지 않는다.
# name: 개발용 docker-compose.yml과 프로젝트를 분리 — down -v가 서로의 컨테이너/볼륨을 지우지 않게
name: file-upload-block-prod
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-fileupload}
      POSTGRES_USER: ${DB_USER:-fileupload}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - prod-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-fileupload} -d ${DB_NAME:-fileupload}"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-fileupload}
      DB_USER: ${DB_USER:-fileupload}
      DB_PASSWORD: ${DB_PASSWORD}
      STORAGE_MODE: ${STORAGE_MODE:-s3}
      # local 모드 폴백용: 비루트 appuser가 쓸 수 있는 경로 (컨테이너 내부라 휘발 — 운영은 s3)
      STORAGE_DIR: /home/appuser/data
      S3_BUCKET: ${S3_BUCKET:-work-841820566166-us-east-1-an}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PREFIX: ${S3_PREFIX:-uploads/}
      # S3 자격 증명: .env의 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY 를 그대로 주입 (.env.example 참고)
      # 둘 다 비워 두면 SDK 기본 자격 증명 체인(EC2 인스턴스 역할)을 사용
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${S3_REGION:-us-east-1}

volumes:
  prod-db-data:
